<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrazione completa — Portfolio Lorenzo Manno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <a href="../../index.html" class="back-link">← Portfolio</a>
    <h1>Registrazione completa</h1>
    <p class="sottotitolo">Form esteso con email, data, slider competenza e provincia.</p>
  </header>

  <main class="contenuto">
    <form id="form-completo" class="box-form" novalidate>
      <div class="riga"><label for="cognome">Cognome</label><input type="text" id="cognome" autocomplete="family-name"></div>
      <div class="riga"><label for="nome">Nome</label><input type="text" id="nome" autocomplete="given-name"></div>
      <div class="riga"><label for="email">Email</label><input type="email" id="email" autocomplete="email"></div>
      <div class="riga"><label for="data-nascita">Data di nascita</label><input type="date" id="data-nascita"></div>

      <fieldset class="riga">
        <legend>Sesso</legend>
        <label class="radio"><input type="radio" name="sesso" value="M" checked> M</label>
        <label class="radio"><input type="radio" name="sesso" value="F"> F</label>
        <label class="radio"><input type="radio" name="sesso" value="Altro"> Altro</label>
      </fieldset>

      <div class="riga">
        <label for="provincia">Provincia</label>
        <select id="provincia">
          <option value="MI">Milano</option>
          <option value="RM">Roma</option>
          <option value="NA">Napoli</option>
          <option value="TO">Torino</option>
        </select>
      </div>

      <div class="riga">
        <label for="livello">Livello di competenza: <output id="livello-out">5</output>/10</label>
        <input type="range" id="livello" min="1" max="10" value="5">
      </div>

      <div class="riga">
        <label class="check"><input type="checkbox" id="termini"> Accetto i termini del servizio</label>
      </div>

      <button type="button" id="btn-invia" class="btn">Conferma registrazione</button>
      <div id="esito" class="esito" role="status" aria-live="polite"></div>
    </form>
  </main>

  <footer class="page-footer">
    <p>&copy; 2026 Lorenzo Manno</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
